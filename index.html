<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloKanban — Local-First Agent-Native Kanban</title>
  <meta name="description" content="SoloKanban is a local-first, agent-native dual-level Kanban board system running entirely in the browser using the File System Access API.">
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="brand-section">
        <div class="brand-logo">⚡</div>
        <h1 class="logo-text">SoloKanban</h1>
      </div>
      <nav id="breadcrumb-nav" class="breadcrumb-nav">
        <span class="nav-pill active">Workspace Board</span>
      </nav>
      <div class="view-switcher-tabs">
        <button id="view-btn-board" class="view-tab-btn active" title="Switch to Kanban Board View">📋 Board</button>
        <button id="view-btn-list" class="view-tab-btn" title="Switch to List View">📝 List</button>
      </div>
    </div>

    <div class="header-right">
      <div class="search-bar-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="global-search-input" placeholder="Filter cards (Title, Body, ID)... ⌘K" class="search-input">
      </div>

      <div class="filter-controls">
        <select id="swimlane-select" class="header-select" title="Group board by swimlanes">
          <option value="">Swimlanes: Off</option>
          <option value="assignee">By Assignee</option>
          <option value="priority">By Priority</option>
          <option value="type">By Type</option>
        </select>
      </div>

      <div class="header-actions">
        <button id="create-card-btn" class="btn-gradient">＋ New Card</button>
        <button id="open-folder-btn" class="btn-header-secondary">📁 Open Folder</button>
        <button id="open-settings-btn" class="btn-header-icon" title="Settings">⚙</button>
      </div>
    </div>
  </header>

  <div id="first-run-banner-container"></div>

  <main id="kanban-board-container" class="kanban-board-container">
    <div class="empty-workspace-prompt">
      <div class="prompt-icon">📁</div>
      <h2>Welcome to SoloKanban</h2>
      <p>Select a local workspace folder to start managing project & feature cards with local-first file system access.</p>
      <button onclick="document.getElementById('open-folder-btn').click()" class="btn-gradient btn-lg">Choose Local Workspace Folder...</button>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
