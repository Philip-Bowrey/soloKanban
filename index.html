<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoloKanban v6.2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>SoloKanban</h1>
            <span id="workspace-name" class="badge">No workspace open</span>
            <nav id="breadcrumbs" class="breadcrumbs"></nav>
        </div>
        <div class="header-right">
            <button id="settings-btn" title="Settings">⚙️</button>
            <button id="open-workspace-btn">Open Workspace</button>
            <button id="new-card-btn" class="primary" disabled>+ New Card</button>
        </div>
    </header>

    <div id="board-container">
        <div id="board" class="board"></div>
        <div id="empty-state" class="empty-state">
            <p>Open a local workspace folder to start.</p>
            <button id="open-workspace-empty-btn">Choose Folder</button>
        </div>
    </div>

    <!-- Card Editor Modal -->
    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div id="card-form"></div>
            </div>
            <div class="modal-footer">
                <span id="conflict-warning" class="conflict-warning hidden">⚠️ Conflict detected</span>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content settings-content">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-btn" id="close-settings-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="labels">Labels</button>
                    <button class="tab-btn" data-tab="custom-fields">Custom Fields</button>
                    <button class="tab-btn" data-tab="feature-types">Feature Types</button>
                    <button class="tab-btn" data-tab="projects">Projects</button>
                </div>
                <div id="settings-content"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
